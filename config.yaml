# Project Info
params:
  project: ""
  version: "v2.0" # Report version displayed in navbar (e.g. v2.0, 1.0.1)

# File Locations (Relative to project root)
rmd_template: ".engine/dashboard.Rmd"
# output_dir: "C:\\Projects\\report_tool\\aper-delta-v2\\aper-delta-v2\\Reports" # Where the HTML files will go e.g. //<host>/shared/Performance-JMeter/reports
# database_path: "C:\\Projects\\report_tool\\aper-delta-v2\\aper-delta-v2\\Data\\Performance_Vault.db" # Update if needed e.g. //<host>/shared/Performance-JMeter/database/Performance_Vault.db

output_dir: "Reports" # Where the HTML files will go e.g. //<host>/shared/Performance-JMeter/reports
database_path: "Data/Performance_Vault.db" # Update if needed e.g. //<host>/shared/Performance-JMeter/database/Performance_Vault.db

sla_file_path: "SLA/performance-sla.yaml" # Update if needed
evidence_dir: "Evidence" # Optional folder for manual CPU/Memory screenshots per run (e.g. Evidence/100002/*.png)
ai_summary_enabled: "true"
ai_url: "https://amplify.planittesting.com/external/api/completion"
ai_model_id: "19b89d52-23cf-463d-a5bb-c2896a0f8661"

# ============================================================
# Label Exclusions
#
# Labels listed here will always be excluded from analysis.
#
# The CLI parameter --labelFilterParam acts as an ADDITIONAL
# exclusion list and does NOT replace these values.
#
# Example:
#   config.yaml:
#     - c_Thinktime
#     - Test Action
#
#   CLI:
#     --labelFilterParam=Debug Sampler,TC_Start
#
# Effective exclusions:
#   c_Thinktime
#   Test Action
#   Debug Sampler
#   TC_Start
# ============================================================
label_exclusions:
  - c_Thinktime
  - Test Action
  - Debug Sampler
  - c_UserLetter_pacing
  - dw_pacing
  - HA_pacing
  - BDR_pacing
  - TAS_pacing
  - c_CMS_Pacing
# System Default Engine - DO NOT EDIT
tool_type: "jmeter"
tool_mappings:
  jmeter:
    timestamp: "timeStamp"
    elapsed: "elapsed"
    label: "label"
    responseCode: "responseCode"
    responseMessage: "responseMessage"
    threadName: "threadName"
    dataType: "dataType"
    success: "success"
    failureMessage: "failureMessage"
    bytes: "bytes"
    sentBytes: "sentBytes"
    grpThreads: "grpThreads"
    allThreads: "allThreads"
    URL: "URL"
    Latency: "Latency"
    IdleTime: "IdleTime"
    Connect: "Connect"
    userPath: "" # JMeter-native doesn't use this, left empty
    population: "" # JMeter-native doesn't use this, left empty

  neoload:
    timestamp: "Time" # NeoLoad raw files usually call this 'Time' or 'Date'
    elapsed: "Response time" # NeoLoad raw transactional files often use 'Duration' instead of 'Response time'
    label: "Element" # NeoLoad raw exports often use 'User Path Element' instead of 'Element'
    success: "Success"
    threadName: "Virtual User ID"
    userPath: "User Path"
    population: "Population"

# Reporting Settings
bin_size: 60
user_action_filter: ".*" # Regex to include all transactions
