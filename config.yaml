# Project Info
params:
  project: ""
  version: "v2.0" # Report version displayed in navbar (e.g. v2.0, 1.0.1)

# File Locations (Relative to project root)
rmd_template: ".engine/dashboard.Rmd"
# output_dir: "C:\\Projects\\report_tool\\aper-delta-v2\\aper-delta-v2\\Reports" # Where the HTML files will go e.g. //<host>/shared/Performance-JMeter/reports
# database_path: "C:\\Projects\\report_tool\\aper-delta-v2\\aper-delta-v2\\Data\\Performance_Vault.db" # Update if needed e.g. //<host>/shared/Performance-JMeter/database/Performance_Vault.db

output_dir: "Reports" # Where the HTML files will go e.g. //<host>/shared/Performance-JMeter/reports
database_path: "Data/Performance_Vault.db" # Update if needed e.g. //<host>/shared/Performance-JMeter/database/Performance_Vault.db

sla_file_path: "SLA/performance-sla.yaml" # Update if needed
evidence_dir: "Evidence" # Optional folder for manual CPU/Memory screenshots per run (e.g. Evidence/100002/*.png)
ai_summary_enabled: "false"
ai_url: "https://amplify.planittesting.com/external/api/completion"
ai_model_id: "19b89d52-23cf-463d-a5bb-c2896a0f8661"

# Timezone Settings
# Use standard IANA timezone names (e.g., "Pacific/Auckland", "Australia/Sydney", "UTC", "Asia/Manila", "Europe/London")
# Set display_timezone to "local" or "" to use the machine's system timezone.
timezone:
  source_timezone: "UTC"               # Timezone of raw timestamps stored in DB (JMeter epoch is always "UTC")
  display_timezone: "Pacific/Auckland" # Target timezone for displaying run dates/times in the report
  show_timezone_abbr: true             # Append timezone abbreviation (e.g., "NZDT", "NZST", "UTC") to timestamps

# Workload Phase Profile (used in Executive Summary & AI prompts)
# Leave empty ("") to automatically calculate ramp-up, steady state, and ramp-down from test telemetry.
workload_profile:
  ramp_up: ""      # Optional override: e.g. "10-minute ramp-up (600s)"
  steady_state: "" # Optional override: e.g. "60 minutes steady state"
  ramp_down: ""    # Optional override: e.g. "5-minute ramp-down (300s)"

# Executive AI Summary Prompt Template
# Supports variables: {app_names}, {env}, {test_type}, {vu_actual}, {duration_desc},
#                     {ramp_up}, {steady_state}, {ramp_down}, {throughput}, {error_rate},
#                     {latency}, {current_rt}, {rt_metric}, {baseline_run_id},
#                     {baseline_comp}, {overall_status}, {breach_cnt}, {worst_label},
#                     {worst_rt}, {worst_sla}, {flow_theme}
ai_prompt_template: |
  Write a clear, natural executive summary of this performance test for project stakeholders.

  Writing Style:
  - Use plain, natural British English (e.g. optimised, prioritised, analysed, behaviour).
  - Write the way an experienced performance engineer speaks to a delivery team: clear, conversational, and easy to read.
  - Avoid stiff corporate jargon, robotic phrasing, or disconnected sentence fragments. Write in complete, natural sentences.
  - Bold important numbers, transaction names, and outcomes inline (e.g. **289 virtual users**, **14.61 TPS**, **0.00% error rate**, **1,286 ms**, **FAIL**).
  - If Ramp-down is "none" or empty, simply do not mention ramp-down at all (never write "without ramp-down").
  - Keep each paragraph to 2–3 clear sentences.
  - Output exactly two paragraphs followed by "Next steps:" and three plain-English bullet points (do NOT put bracketed tags like [Root cause] or [Remediation] at the start of bullets).

  Test Results:
  Application : {app_names} ({env})
  Test Type   : {test_type}
  Workload    : {vu_actual} virtual users ({duration_desc})
  Throughput  : {throughput} TPS
  Error Rate  : {error_rate}%
  Latency     : {latency} ms ({baseline_comp})
  Status      : {overall_status}
  Breaches    : {breach_cnt} ({rt_metric}) — slowest transaction: {worst_label} at {worst_rt} ms vs {worst_sla} ms target
  Main Flows  : {flow_theme}

  Structure:
  PARAGRAPH 1: Explain how the test ran—how many virtual users it handled, the ramp-up and steady-state profile, the average throughput and error rate, and how overall response time compared to the baseline run.
  PARAGRAPH 2: Explain how transactions performed against the response time target, naming the slowest transaction if any exceeded the limit. State the overall outcome clearly and close with a helpful, practical recommendation on what to review before the next run.
  Next steps:
  - First bullet: Which slow transaction or area to investigate first (bold the transaction name).
  - Second bullet: What practical tuning or fix to look into.
  - Third bullet: Re-running the test under the same load to confirm the fix worked.

# ============================================================
# Label Exclusions
#
# Labels listed here will always be excluded from analysis.
#
# The CLI parameter --labelFilterParam acts as an ADDITIONAL
# exclusion list and does NOT replace these values.
#
# Example:
#   config.yaml:
#     - c_Thinktime
#     - Test Action
#
#   CLI:
#     --labelFilterParam=Debug Sampler,TC_Start
#
# Effective exclusions:
#   c_Thinktime
#   Test Action
#   Debug Sampler
#   TC_Start
# ============================================================
label_exclusions:
  - c_Thinktime
  - Test Action
  - Debug Sampler
  - c_UserLetter_pacing
  - dw_pacing
  - HA_pacing
  - BDR_pacing
  - TAS_pacing
  - c_CMS_Pacing
# Canonical Engine & External Tool Mappings
# All external tools map incoming column headers to canonical JMeter field names during ingestion.
tool_type: "jmeter"
tool_mappings:
  jmeter:
    timestamp: "timeStamp"
    elapsed: "elapsed"
    label: "label"
    responseCode: "responseCode"
    responseMessage: "responseMessage"
    threadName: "threadName"
    dataType: "dataType"
    success: "success"
    failureMessage: "failureMessage"
    bytes: "bytes"
    sentBytes: "sentBytes"
    grpThreads: "grpThreads"
    allThreads: "allThreads"
    URL: "URL"
    Latency: "Latency"
    IdleTime: "IdleTime"
    Connect: "Connect"

  neoload:
    timestamp: "Time" # NeoLoad raw files usually call this 'Time' or 'Date'
    elapsed: "Response time" # NeoLoad raw transactional files often use 'Duration' instead of 'Response time'
    label: "Element" # NeoLoad raw exports often use 'User Path Element' instead of 'Element'
    success: "Success"
    threadName: "Virtual User ID"
    userPath: "User Path"
    population: "Population"

# Reporting Settings
bin_size: 60
user_action_filter: ".*" # Regex to include all transactions
