# Project Info
params:
  project: ""
  version: "v2.0" # Report version displayed in navbar (e.g. v2.0, 1.0.1)

# File Locations (Relative to project root)
rmd_template: ".engine/dashboard.Rmd"
# output_dir: "C:\\Projects\\report_tool\\aper-delta-v2\\aper-delta-v2\\Reports" # Where the HTML files will go e.g. //<host>/shared/Performance-JMeter/reports
# database_path: "C:\\Projects\\report_tool\\aper-delta-v2\\aper-delta-v2\\Data\\Performance_Vault.db" # Update if needed e.g. //<host>/shared/Performance-JMeter/database/Performance_Vault.db

output_dir: "Reports" # Where the HTML files will go e.g. //<host>/shared/Performance-JMeter/reports
database_path: "Data/Performance_Vault.db" # Update if needed e.g. //<host>/shared/Performance-JMeter/database/Performance_Vault.db

sla_file_path: "SLA/performance-sla.yaml" # Update if needed
evidence_dir: "Evidence" # Optional folder for manual CPU/Memory screenshots per run (e.g. Evidence/100002/*.png)
ai_summary_enabled: "true"
ai_url: "https://amplify.planittesting.com/external/api/completion"
ai_model_id: "19b89d52-23cf-463d-a5bb-c2896a0f8661"

# Workload Phase Profile (used in Executive Summary & AI prompts)
# If left empty (""), phases are automatically calculated from the test duration
workload_profile:
  ramp_up: "10-minute ramp-up (600s)"
  steady_state: "75 minutes steady state"
  ramp_down: ""   # Optional: e.g. "5 minutes" (leave empty or "none" if not applicable)

# Executive AI Summary Prompt Template
# Supports variables: {app_names}, {env}, {test_type}, {vu_actual}, {duration_desc},
#                     {ramp_up}, {steady_state}, {ramp_down}, {throughput}, {error_rate},
#                     {latency}, {current_rt}, {rt_metric}, {baseline_run_id},
#                     {baseline_comp}, {overall_status}, {breach_cnt}, {worst_label},
#                     {worst_rt}, {worst_sla}, {flow_theme}
ai_prompt_template: |
  You are a Senior Performance Engineering Principal writing a concise executive assessment
  for C-level leadership and programme stakeholders.

  Language & Style:
  - British English throughout (optimised, prioritised, analysed, behaviour, programme).
  - Factual, direct, and constructive. No preamble, no filler, no hedging. State what happened.
  - Lead with numbers. Bold all key metrics and outcomes inline
    (e.g., **337 virtual users**, **15.45 TPS**, **0.05% error rate**, **FAIL**, **5 SLA breaches**,
    **worst transaction name**).
  - Each paragraph: 3–4 sentences maximum.
  - If status is FAIL: close constructively — identify the path forward, not the failure alone.
  - Output: exactly two paragraphs followed by exactly three bullet points.

  Test Evidence:
  Application : {app_names} ({env})
  Test Type   : {test_type}
  Workload    : {vu_actual} virtual users | {duration_desc}
  Ramp-up     : {ramp_up}
  Steady-state: {steady_state}
  Ramp-down   : {ramp_down}
  Throughput  : {throughput} TPS
  Error Rate  : {error_rate}%
  Latency     : {latency} ms ({baseline_comp})
  Status      : {overall_status}
  Breaches    : {breach_cnt} ({rt_metric}) — worst: {worst_label} at {worst_rt} ms vs {worst_sla} ms SLA
  Test Scope  : {flow_theme}

  Output:
  PARAGRAPH 1 — What happened:
  State the workload, throughput, error rate, and latency against baseline. Numbers first.

  PARAGRAPH 2 — Verdict:
  State the SLA breach count, name the worst offending transaction, and deliver the
  verdict (**PASS** or **FAIL**) plainly. If FAIL, close with one constructive sentence
  on the remediation path.

  Next steps:
  - [Root cause] Triage action targeting the specific failing component or transaction in bold.
  - [Remediation] Targeted fix or investigation action.
  - [Retest] Clear criterion for retest and release gating.

# ============================================================
# Label Exclusions
#
# Labels listed here will always be excluded from analysis.
#
# The CLI parameter --labelFilterParam acts as an ADDITIONAL
# exclusion list and does NOT replace these values.
#
# Example:
#   config.yaml:
#     - c_Thinktime
#     - Test Action
#
#   CLI:
#     --labelFilterParam=Debug Sampler,TC_Start
#
# Effective exclusions:
#   c_Thinktime
#   Test Action
#   Debug Sampler
#   TC_Start
# ============================================================
label_exclusions:
  - c_Thinktime
  - Test Action
  - Debug Sampler
  - c_UserLetter_pacing
  - dw_pacing
  - HA_pacing
  - BDR_pacing
  - TAS_pacing
  - c_CMS_Pacing
# System Default Engine - DO NOT EDIT
tool_type: "jmeter"
tool_mappings:
  jmeter:
    timestamp: "timeStamp"
    elapsed: "elapsed"
    label: "label"
    responseCode: "responseCode"
    responseMessage: "responseMessage"
    threadName: "threadName"
    dataType: "dataType"
    success: "success"
    failureMessage: "failureMessage"
    bytes: "bytes"
    sentBytes: "sentBytes"
    grpThreads: "grpThreads"
    allThreads: "allThreads"
    URL: "URL"
    Latency: "Latency"
    IdleTime: "IdleTime"
    Connect: "Connect"
    userPath: "" # JMeter-native doesn't use this, left empty
    population: "" # JMeter-native doesn't use this, left empty

  neoload:
    timestamp: "Time" # NeoLoad raw files usually call this 'Time' or 'Date'
    elapsed: "Response time" # NeoLoad raw transactional files often use 'Duration' instead of 'Response time'
    label: "Element" # NeoLoad raw exports often use 'User Path Element' instead of 'Element'
    success: "Success"
    threadName: "Virtual User ID"
    userPath: "User Path"
    population: "Population"

# Reporting Settings
bin_size: 60
user_action_filter: ".*" # Regex to include all transactions
