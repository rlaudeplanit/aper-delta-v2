# ==============================================================================
# performance-sla.yaml
# ------------------------------------------------------------------------------
# Defines SLA thresholds applied globally across all run_ids in a report.
# Referenced from config.yaml via: sla_file_path: "SLA/performance-sla.yaml"
#
# Governance & Metric Toggles:
#   show_overall_status : Set to false for an informational report (hides the
#                         OVERALL STATUS: PASS/FAIL verdict and red fail styling).
#   enabled             : Per-metric toggle (true/false) on individual rules
#                         and on response_time_sla.
#
# Supported operators: "<=", ">=", "<", ">", "=="
# ==============================================================================

show_overall_status: false

sla_rules:

  - metric: total_users
    enabled: false
    label: "Virtual Users"
    operator: ">="
    threshold: 1
    description: "At least 1 virtual user must be recorded for the run to be valid."

  - metric: error_rate
    enabled: false
    label: "Error Rate"
    operator: "<="
    threshold: 10.00
    unit: "%"
    description: "Error rate per scenario must not exceed XX%."
    application_thresholds: # overrides
      - app_name: "MyMSD-CPP-X5"
        threshold: 10.00
      - app_name: "ECS-X5"
        threshold: 10.00
      - app_name: "EOS"
        threshold: 10.00
      - app_name: "CPP"
        threshold: 10.00
      - app_name: "APIM"
        threshold: 10.00
      - app_name: "BPM"
        threshold: 10.00

  - metric: throughput
    enabled: false
    label: "Throughput"
    operator: ">="
    threshold: 5.1
    unit: "tps"
    description: "Throughput per application must sustain at least X transactions per second."
    application_thresholds: # overrides
      - app_name: "MyMSD-CPP-X5"
        threshold: 5.0
      - app_name: "ECS-X5"
        threshold: 3.9
      - app_name: "EOS"
        threshold: 5.1
      - app_name: "CPP"
        threshold: 5.1
      - app_name: "APIM"
        threshold: 5.1
      - app_name: "BPM"
        threshold: 5.1


# ==============================================================================
# RESPONSE TIME SLA — per-transaction (label) evaluation
# ------------------------------------------------------------------------------
# enabled: true/false toggle for transaction response time SLA evaluation
# metric: which percentile to evaluate — "p90" or "p95" or "avg"
# default_threshold: applied to ANY transaction not listed in "overrides"
# tolerance_pct: allows actual value to exceed threshold by this % and still pass
#                (0 = strict, no tolerance)
# overrides: per-transaction custom thresholds — only list exceptions here.
#            New/unlisted transactions automatically use default_threshold.
#            Only labels that starts-with.
# ==============================================================================

response_time_sla:
  enabled: false
  metric: p95
  unit: "ms"
  default_threshold: 3000

  overrides:
    - label: "MyMSD"
      threshold: 3000
    - label: "CMS"
      threshold: 100
    - label: "MyMSD_003_Login_ButtonSelection_Registration"
      threshold: 2000
